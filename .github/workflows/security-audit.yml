name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run npm audit
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > audit-report.json 2>&1 || true
          echo "audit_exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check for critical vulnerabilities
        run: |
          if [ -f audit-report.json ]; then
            CRITICAL=$(node -e "
              const r = require('./audit-report.json') || {};
              const vulns = r.vulnerabilities || {};
              const critical = Object.entries(vulns)
                .filter(([,v]) => v.severity === 'critical')
                .map(([name, v]) => ({ name, ...v }));
              console.log(JSON.stringify(critical));
            ")
            echo "CRITICAL_VULNS=$CRITICAL" >> $GITHUB_ENV
          fi

      - name: Create issue for critical vulns
        if: env.CRITICAL_VULNS != '[]' && env.CRITICAL_VULNS != ''
        uses: actions/github-script@v7
        with:
          script: |
            const vulns = JSON.parse(process.env.CRITICAL_VULNS);
            if (!vulns.length) return;
            let body = '## Critical Vulnerabilities Found\n\n';
            vulns.forEach(v => {
              body += `- **${v.name}** (${v.severity})\n`;
              body += `  - Via: ${v.via?.map(x => typeof x === 'string' ? x : x.title).join(', ') || 'unknown'}\n`;
              body += `  - Fix: ${v.fixAvailable === false ? 'No fix available' : 'Update available'}\n\n`;
            });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Critical security vulnerabilities detected',
              body: body,
              labels: ['security', 'automated']
            });
