name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Create env file
        run: |
          cat > .env << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/aegiscore' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'ci-build-secret-do-not-use-in-production' }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'ci-build-key' }}
          EOF

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3
          if-no-files-found: error

  extension:
    name: Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Build extension ZIP
        run: npm run build:extension

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegiscore-extension
          path: public/extensions/*.zip
          retention-days: 7
          if-no-files-found: error

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, extension]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Check:** ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint:** ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next.js Build:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Extension Build:** ${{ needs.extension.result }}" >> $GITHUB_STEP_SUMMARY
