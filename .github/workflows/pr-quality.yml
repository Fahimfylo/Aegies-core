name: PR Quality

on:
  pull_request:
    types: [opened, synchronize, edited, labeled, unlabeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    name: Auto Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

  size:
    name: Check Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Check PR size
        uses: insightsengineering/PR-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: 10
          s_max_size: 50
          m_max_size: 200
          l_max_size: 600
          fail_if_xl: false
          message_if_xl: >
            This PR is very large ({{ files }} files, {{ changes }} changes).
            Consider splitting into smaller PRs for faster review.
