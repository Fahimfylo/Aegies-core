name: CD

on:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/aegiscore' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-secret' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-build-key' }}

      - name: Build extension
        run: npm run build:extension

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Build extension ZIP
        run: npm run build:extension

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AegisCore v${{ steps.version.outputs.VERSION }}
          body_path: ""
          generate_release_notes: true
          files: |
            public/extensions/*.zip
          fail_on_unmatched_files: false

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [validate, release]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Build production app
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build extension
        run: npm run build:extension

      - name: Deploy to Vercel
        if: ${{ vars.DEPLOY_TARGET == 'vercel' }}
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Deploy via rsync (VPS)
        if: ${{ vars.DEPLOY_TARGET == 'vps' }}
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "."
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_PATH }}
          EXCLUDE: "/node_modules/, /.next/cache/, /public/uploads/"

      - name: Deploy to Railway
        if: ${{ vars.DEPLOY_TARGET == 'railway' }}
        run: npx railway up --service ${{ vars.RAILWAY_SERVICE }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
